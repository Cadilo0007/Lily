<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Bouquet: 3 Lilies & Tulips</title>
    <style>
        body { 
            background: #020502; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        canvas { 
            max-height: 100vh; 
            max-width: 100vw; 
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <canvas id="bouquet" width="720" height="1280"></canvas>

<script>
// --- CORE CONSTANTS ---
const canvas = document.getElementById("bouquet");
const ctx = canvas.getContext("2d");
const W = 720, H = 1280;
const T_STEM = 4.0, T_B0 = 5.0, T_B1 = 14.0;
const LOOP_AT = 28.0; 
const S = W / 720.0;
const MathPI = Math.PI;

const flCanvas = document.createElement("canvas");
flCanvas.width = W; flCanvas.height = H;
const flCtx = flCanvas.getContext("2d");
let imgData = flCtx.createImageData(W, H);

// --- RANDOM NUMBER GENERATOR ---
function mulberry32(a) {
    return function() {
        var t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}
const rng = mulberry32(11);

function randomNormal(mean = 0, stdDev = 1) {
    let u1 = rng(), u2 = rng();
    while (u1 === 0) u1 = rng();
    return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * MathPI * u2) * stdDev + mean;
}

// --- MATH UTILITIES ---
function smooth(x) {
    x = Math.max(0, Math.min(1, x));
    return x * x * (3 - 2 * x);
}
function lerp(a, b, t) { return a + (b - a) * t; }
function interp(x, xp, fp) {
    if (x <= xp[0]) return fp[0];
    if (x >= xp[xp.length - 1]) return fp[fp.length - 1];
    for (let i = 0; i < xp.length - 1; i++) {
        if (x >= xp[i] && x <= xp[i+1]) {
            let t = (x - xp[i]) / (xp[i+1] - xp[i]);
            return fp[i] + t * (fp[i+1] - fp[i]);
        }
    }
    return fp[fp.length - 1];
}

function midrib(L, a0, curl, K=40) {
    let us = new Float32Array(K + 1), r = new Float32Array(K + 1), h = new Float32Array(K + 1);
    let ds = L / K, sum_r = 0, sum_h = 0;
    for (let i = 0; i <= K; i++) {
        let u = i / K;
        us[i] = u;
        if (i > 0) {
            let al = a0 + curl * Math.pow(u, 1.6);
            sum_r += Math.sin(al) * ds;
            sum_h += Math.cos(al) * ds;
            r[i] = sum_r; h[i] = sum_h;
        }
    }
    return {us, r, h};
}

// --- FLOWER GENERATORS ---
const NP_LILY = 3200;
let lily_petals = [];
for (let k = 0; k < 6; k++) {
    let outer = (k % 2 === 0);
    let pts = [];
    for (let i = 0; i < NP_LILY; i++) {
        let pu = Math.pow(rng(), 0.85), pv = rng() * 2 - 1;
        let prof = Math.pow(Math.sin(MathPI * Math.pow(pu, 0.7)), 0.9);
        
        let stops = [0, 0.2, 0.6, 1];
        let rr = interp(pu, stops, [170, 230, 250, 245]);
        let gg = interp(pu, stops, [220, 100, 210, 240]);
        let bb = interp(pu, stops, [120, 140, 220, 240]);
        
        let mid = (Math.abs(pv) < 0.15) && (pu > 0.1) && (pu < 0.7);
        if (mid) { rr *= 0.85; gg *= 0.6; bb *= 0.7; } 
        let spot = (rng() < 0.12) && (pu > 0.15) && (pu < 0.6) && (Math.abs(pv) < 0.55);
        if (spot) { rr = 120; gg = 20; bb = 40; } 
        
        pts.push({pu, pv, prof, r: rr, g: gg, b: bb, noise: 0.85 + 0.3 * rng()});
    }
    lily_petals.push({
        phi: (k * 60 + 8) * MathPI / 180, L: (outer ? 280 : 260) * S, Wm: (outer ? 64 : 72) * S,
        ac: 0.10, ao: outer ? 1.1 : 0.85, curl: outer ? 0.9 : 0.7, pts: pts
    });
}

const NP_TULIP = 3500;
let tulip_petals = [];
for (let k = 0; k < 6; k++) {
    let outer = (k % 2 === 0);
    let pts = [];
    for (let i = 0; i < NP_TULIP; i++) {
        let pu = Math.pow(rng(), 0.85), pv = rng() * 2 - 1;
        let prof = Math.pow(Math.sin(MathPI * pu), 0.75);
        pts.push({pu, pv, prof, noise: 0.85 + 0.3 * rng()});
    }
    tulip_petals.push({
        phi: (k * 60 + (outer ? 0 : 30)) * MathPI / 180, L: (outer ? 190 : 170) * S, Wm: (outer ? 95 : 80) * S,
        ac: 0.02, ao: outer ? 0.35 : 0.15, curl: 0.15, pts: pts
    });
}

let stems = [];
for (let i = 0; i < 3000; i++) {
    let s = rng(), dx = randomNormal(0, 1) * (4.0 * S) * (1 - 0.5 * s);
    stems.push({s, dx, r: lerp(30, 60, s), g: lerp(100, 150, s), b: lerp(30, 60, s), noise: 0.8 + 0.4 * rng()});
}

let leaves = [];
let lf_data = [[0.2, 220, 1], [0.4, 200, -1], [0.6, 160, 1]];
for (let i = 0; i < lf_data.length; i++) {
    let pts = [];
    for (let j = 0; j < 1200; j++) {
        let u = Math.pow(rng(), 0.9), v = rng() * 2 - 1;
        let prof = Math.pow(Math.sin(MathPI * Math.pow(u, 0.8)), 0.8);
        let r = lerp(20, 60, u), g = lerp(80, 140, u), b = lerp(20, 50, u);
        if (Math.abs(v) < 0.05) { r = 90; g = 160; b = 70; }
        pts.push({u, v, prof, r, g, b, noise: 0.8 + 0.4 * rng()});
    }
    leaves.push({s0: lf_data[i][0], L: lf_data[i][1] * S, side: lf_data[i][2], pts});
}

let lily_stam = [];
for (let k = 0; k < 6; k++) {
    let an = [];
    for (let i = 0; i < 40; i++) an.push([randomNormal(0, 1), randomNormal(0, 1), rng()]);
    lily_stam.push({phi: (k * 60 + 38) * MathPI / 180, an});
}

// --- RENDER BUFFER (In-increase natin to 320,000 para sa 7 flowers) ---
const MAX_PTS = 320000;
const ptX = new Float32Array(MAX_PTS), ptY = new Float32Array(MAX_PTS), ptZ = new Float32Array(MAX_PTS);
const ptR = new Uint8Array(MAX_PTS), ptG = new Uint8Array(MAX_PTS), ptB = new Uint8Array(MAX_PTS);
const indices = new Int32Array(MAX_PTS);
let ptCount = 0;

function addPt(x, y, z, r, g, b) {
    if (ptCount >= MAX_PTS) return;
    ptX[ptCount] = x; ptY[ptCount] = y; ptZ[ptCount] = z;
    ptR[ptCount] = r; ptG[ptCount] = g; ptB[ptCount] = b;
    indices[ptCount] = ptCount;
    ptCount++;
}

// --- THE GRAND BOUQUET ARRANGEMENT ---
const gy = H * 1.15; // Convergence point (where stems tie together)
const flowers = [
    // 3 LILIES (Crown / Focal Points)
    { type: 'lily',  color: 'star',   x: W * 0.50, y: H * 0.25, s: 1.00, t_off: 0.0, sway: 0.0,  rot: 0.0 },   // Top Center Lily
    { type: 'lily',  color: 'star',   x: W * 0.25, y: H * 0.42, s: 0.85, t_off: 1.8, sway: -1.0, rot: -0.4 },  // Left Lily
    { type: 'lily',  color: 'star',   x: W * 0.75, y: H * 0.38, s: 0.90, t_off: 3.0, sway: 1.2,  rot: 0.5 },   // Right Lily
    
    // 4 TULIPS (Accents / Lower Fillers)
    { type: 'tulip', color: 'red',    x: W * 0.15, y: H * 0.25, s: 0.75, t_off: 2.5, sway: -1.5, rot: -0.8 },  // High Left Tulip
    { type: 'tulip', color: 'yellow', x: W * 0.20, y: H * 0.65, s: 0.85, t_off: 4.5, sway: -1.8, rot: -0.6 },  // Bottom Left Tulip
    { type: 'tulip', color: 'purple', x: W * 0.82, y: H * 0.62, s: 0.85, t_off: 5.5, sway: 1.8,  rot: 0.5 },   // Bottom Right Tulip
    { type: 'tulip', color: 'pink',   x: W * 0.52, y: H * 0.68, s: 0.95, t_off: 6.5, sway: 0.2,  rot: 0.1 },   // Front Center Tulip
];

function getTulipColor(c_name, pu, noise) {
    let r, g, b;
    if (c_name === 'red') { r = lerp(220, 140, pu); g = lerp(20, 0, pu); b = lerp(30, 10, pu); }
    else if (c_name === 'yellow') { r = lerp(250, 240, pu); g = lerp(210, 160, pu); b = lerp(20, 0, pu); }
    else if (c_name === 'purple') { r = lerp(160, 80, pu); g = lerp(30, 0, pu); b = lerp(180, 100, pu); }
    else if (c_name === 'pink') { r = lerp(255, 220, pu); g = lerp(100, 40, pu); b = lerp(160, 90, pu); }
    
    // Greenish-yellow base blending for realism
    let base_mix = Math.max(0, 1 - pu * 4.0); 
    r = lerp(r, 160, base_mix); g = lerp(g, 220, base_mix); b = lerp(b, 80, base_mix);
    return [r * noise, g * noise, b * noise];
}

function render(t) {
    ptCount = 0;

    for (let l_idx = 0; l_idx < flowers.length; l_idx++) {
        let inst = flowers[l_idx];
        let lt = Math.max(0, t - inst.t_off);
        
        let g_t = smooth(lt / T_STEM);
        let e = smooth((lt - T_B0) / (T_B1 - T_B0));
        let rev = smooth((lt - T_STEM + 0.3) / 1.6);
        
        let getX = (s) => lerp(W/2, inst.x, s) + 40 * S * Math.sin(MathPI * s) * inst.sway + (10 * S * Math.sin(0.9 * t)) * s * s;
        let getY = (s) => lerp(gy, inst.y, s);

        let hx = getX(1.0), hy = getY(1.0);

        // STEMS
        for (let i = 0; i < stems.length; i++) {
            if (stems[i].s <= g_t) {
                let bx = getX(stems[i].s), by = getY(stems[i].s);
                let col = stems[i];
                addPt(bx + col.dx * inst.s, by, -100, col.r * col.noise, col.g * col.noise, col.b * col.noise);
            }
        }

        // LEAVES
        for (let i = 0; i < leaves.length; i++) {
            let lf = leaves[i];
            let lg = Math.max(0, Math.min(1, (g_t - lf.s0) * 2.5));
            if (lg <= 0.01) continue;
            let m = midrib(lf.L * lg, 0.85, 1.1);
            let bx = getX(lf.s0), by = getY(lf.s0);
            let sway_lf = Math.sin(lt * 1.2 + lf.s0 * 5) * 0.03;
            for (let j = 0; j < lf.pts.length; j++) {
                let pt = lf.pts[j];
                let rr = interp(pt.u, m.us, m.r), hh = interp(pt.u, m.us, m.h);
                let wid = 18 * S * pt.prof * lg;
                addPt(bx + (lf.side * (rr + pt.v * wid * 0.35) + sway_lf * hh * lf.side) * inst.s, 
                      by + (-hh + pt.v * wid) * inst.s, -90 * inst.s, 
                      pt.r * pt.noise, pt.g * pt.noise, pt.b * pt.noise);
            }
        }

        // PETALS
        if (rev > 0.01) {
            let cp = Math.cos(0.25 + lt * 0.22), sp = Math.sin(0.25 + lt * 0.22);
            let ct = Math.cos(0.5), st = Math.sin(0.5);
            let sway_t = Math.sin(lt * 0.8) * 0.02;
            
            let p_arr = inst.type === 'lily' ? lily_petals : tulip_petals;

            for (let i = 0; i < p_arr.length; i++) {
                let p = p_arr[i];
                let Ls = p.L * (inst.type === 'lily' ? (0.45 + 0.55 * e) : (0.5 + 0.5 * e)) * (0.35 + 0.65 * rev);
                let m = midrib(Ls, lerp(p.ac, p.ao, e), (0.12 + 0.88 * e) * p.curl);
                
                for (let j = 0; j < p.pts.length; j++) {
                    let pt = p.pts[j];
                    if (pt.pu > rev) continue;
                    let rr = interp(pt.pu, m.us, m.r), hh = interp(pt.pu, m.us, m.h);
                    let wid = p.Wm * (0.55 + 0.45 * e) * pt.prof * (0.35 + 0.65 * rev);
                    
                    let ph = p.phi + inst.rot;
                    let X = rr * Math.cos(ph) - pt.pv * wid * Math.sin(ph);
                    let Z = rr * Math.sin(ph) + pt.pv * wid * Math.cos(ph);
                    let Y = hh + (pt.pv * pt.pv) * wid * (0.30 * (1 - e) - 0.25 * e);
                    
                    let Xp = X * cp + Z * sp, Zp = -X * sp + Z * cp, sy = Y * ct - Zp * st;
                    let shade = 0.45 + 0.55 * Math.max(0, Math.min(1, Zp / p.L * 0.8 + 0.5));
                    
                    let rgb;
                    if (inst.type === 'lily') {
                        rgb = [pt.r * pt.noise, pt.g * pt.noise, pt.b * pt.noise];
                    } else {
                        rgb = getTulipColor(inst.color, pt.pu, pt.noise);
                    }

                    addPt(hx + (Xp + sway_t * sy) * inst.s, hy - sy * inst.s, Zp * inst.s, rgb[0] * shade, rgb[1] * shade, rgb[2] * shade);
                }
            }

            // STAMENS
            if (e > 0.28) {
                if (inst.type === 'lily') {
                    let sr = smooth((e - 0.28) / 0.4);
                    for (let k = 0; k < lily_stam.length; k++) {
                        let sdat = lily_stam[k];
                        let m = midrib(215 * S * (0.4 + 0.6 * e) * sr, lerp(0.15, 0.62, e), 0.55 * e);
                        let ph = sdat.phi + inst.rot;
                        
                        for (let i = 0; i < 40; i++) { 
                            let u = rng();
                            let X = interp(u, m.us, m.r) * Math.cos(ph), Z = interp(u, m.us, m.r) * Math.sin(ph);
                            let Xp = X * cp + Z * sp, Zp = -X * sp + Z * cp;
                            addPt(hx + Xp * inst.s, hy - (interp(u, m.us, m.h) * ct - Zp * st) * inst.s, (Zp + 5) * inst.s, 200, 240, 180); 
                        }
                        
                        let lr = m.r[m.r.length-1], lh = m.h[m.h.length-1];
                        let txp = lr * Math.cos(ph) * cp + lr * Math.sin(ph) * sp;
                        let tzp = -lr * Math.cos(ph) * sp + lr * Math.sin(ph) * cp;
                        let tsy = lh * ct - tzp * st;
                        
                        for (let i = 0; i < 40; i++) { 
                            let an = sdat.an[i], f = 0.7 + 0.3 * an[2];
                            addPt(hx + (txp + an[0] * 6 * S) * inst.s, hy - (tsy - an[1] * 4 * S) * inst.s, (tzp + 6) * inst.s, 160 * f, 60 * f, 10 * f); 
                        }
                    }
                } else {
                    for(let k=0; k<6; k++) {
                        let ph = k * 60 * MathPI / 180 + inst.rot;
                        let Ls = 65 * S * e;
                        for(let i=0; i<30; i++) {
                            let u = rng(), rr = u * 15 * S, hh = u * Ls;
                            let Xp = (rr * Math.cos(ph)) * cp + (rr * Math.sin(ph)) * sp;
                            let Zp = -(rr * Math.cos(ph)) * sp + (rr * Math.sin(ph)) * cp;
                            let sy = hh * ct - Zp * st;
                            addPt(hx + Xp * inst.s, hy - sy * inst.s, (Zp + 2) * inst.s, 200, 220, 150);
                            
                            if (u > 0.8) {
                                addPt(hx + Xp * inst.s + (rng()-0.5)*8*S, hy - sy * inst.s, (Zp + 4) * inst.s, 40, 20, 20); 
                            }
                        }
                    }
                }
            }
        }
    } 

    // Depth Sorting
    let activeIndices = indices.subarray(0, ptCount);
    activeIndices.sort((a, b) => ptZ[a] - ptZ[b]);

    // Draw Buffer
    imgData.data.fill(0); 
    let data = imgData.data;
    
    for (let k = 0; k < ptCount; k++) {
        let i = activeIndices[k];
        let x = ptX[i] | 0, y = ptY[i] | 0;
        if (x >= 0 && x < W - 1 && y >= 0 && y < H - 1) {
            let idx = (y * W + x) * 4;
            let r = ptR[i], g = ptG[i], b = ptB[i];
            
            data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
            data[idx+4] = r; data[idx+5] = g; data[idx+6] = b; data[idx+7] = 255;
            data[idx + W*4] = r; data[idx + W*4 + 1] = g; data[idx + W*4 + 2] = b; data[idx + W*4 + 3] = 255;
        }
    }
    flCtx.putImageData(imgData, 0, 0);

    // BACKGROUND
    let bgGrad = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.8);
    bgGrad.addColorStop(0, "#121a12"); 
    bgGrad.addColorStop(1, "#020502"); 
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.filter = "blur(0.8px)"; 
    ctx.drawImage(flCanvas, 0, 0);
    ctx.filter = "none";
}

// --- MAIN LOOP ---
let time = 0.0, paused = false;
window.addEventListener("keydown", (e) => {
    if (e.key === "r") time = 0;
    if (e.key === " ") paused = !paused;
});

window.addEventListener("touchstart", () => paused = !paused);

let lastTime = performance.now();
function animate(now) {
    let dt = (now - lastTime) / 1000.0;
    lastTime = now;
    if (!paused) {
        time += Math.min(dt, 0.1);
        if (LOOP_AT && time > LOOP_AT) time = 0; 
    }
    render(time);
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

</script>
</body>
</html>
